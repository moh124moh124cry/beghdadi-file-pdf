<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEGHDADI FILE PDF</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --primary-color:#007bff;
      --secondary-color:#6c757d;
      --success-color:#28a745;
      --bg-color:#121212;
      --panel-bg:#1e1e1e;
      --text-color:#e0e0e0;
      --border-color:#333333;
    }
    * { box-sizing:border-box; }
    body {
      font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
      background-color:var(--bg-color);
      color:var(--text-color);
      margin:0;
      padding:0;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    header {
      background-color:#000;
      color:#fff;
      width:100%;
      text-align:center;
      padding:15px 0;
      font-size:24px;
      font-weight:bold;
      box-shadow:0 4px 6px rgba(0,0,0,.3);
    }
    .container { width:90%;max-width:800px;margin:20px auto;text-align:center; }
    .kids-banner {
      width:100%;height:200px;background-color:var(--panel-bg);
      border:2px dashed var(--border-color);border-radius:10px;
      display:flex;justify-content:center;align-items:center;
      margin-bottom:20px;color:#888;font-size:18px;overflow:hidden;
    }
    .kids-banner img { width:100%;height:100%;object-fit:cover; }
    .upload-btn {
      background-color:var(--primary-color);color:#fff;padding:12px 24px;
      font-size:18px;border:0;border-radius:5px;cursor:pointer;
      margin-bottom:20px;transition:.3s;
    }
    .upload-btn:hover { background-color:#0056b3; }
    #fileInput { display:none; }

    /* الشريط الوحيد الجديد: إرشادات تعديل النص فقط */
    .edit-toolbar {
      display:none;flex-wrap:wrap;gap:10px;justify-content:center;
      align-items:center;margin-bottom:15px;background-color:var(--panel-bg);
      padding:10px;border-radius:8px;border:1px solid var(--border-color);
    }
    .edit-hint { color:#ddd;font-size:14px;line-height:1.6; }
    .edit-toolbar button {
      padding:8px 15px;font-size:14px;border:0;border-radius:5px;
      cursor:pointer;font-weight:bold;background:#dc3545;color:#fff;
    }

    .preview-area {
      width:100%;min-height:300px;background-color:var(--panel-bg);
      border:1px solid var(--border-color);border-radius:10px;margin-bottom:20px;
      display:flex;justify-content:center;align-items:center;
      box-shadow:0 2px 4px rgba(0,0,0,.5);padding:10px;
      position:relative;overflow:auto;
    }
    .page-editor { position:relative;display:inline-block;line-height:0;max-width:100%; }
    .page-editor canvas { display:block;max-width:100%;max-height:500px;border-radius:8px; }
    .text-layer { position:absolute;inset:0;pointer-events:none;line-height:normal; }
    .ocr-text {
      position:absolute;pointer-events:auto;min-width:14px;min-height:18px;
      border:1px dashed rgba(0,123,255,.85);background:rgba(255,255,255,.92);
      color:#000;padding:1px 3px;border-radius:3px;outline:none;
      white-space:pre;overflow:visible;direction:auto;text-align:start;
    }
    .ocr-text:focus { border:2px solid #007bff;box-shadow:0 0 0 3px rgba(0,123,255,.2);z-index:5; }
    .text-layer.locked .ocr-text { pointer-events:none;border-color:transparent;background:transparent;color:transparent; }

    .controls { display:flex;flex-wrap:wrap;gap:10px;justify-content:center; }
    .controls button {
      padding:10px 15px;font-size:14px;border:0;border-radius:5px;
      cursor:pointer;color:#fff;transition:.3s;
    }
    .btn-edit { background-color:#ffc107;color:#000!important; }
    .btn-confirm { background-color:var(--success-color); }
    .btn-export-pdf { background-color:#dc3545; }
    .btn-print { background-color:var(--secondary-color); }
    .btn-compress { background-color:#17a2b8; }
    .btn-export-img { background-color:#6610f2; }
    .controls button:hover { opacity:.8; }
    .controls button:disabled { opacity:.45;cursor:not-allowed; }

    .processing {
      display:none;position:absolute;inset:0;background:rgba(18,18,18,.9);
      z-index:20;align-items:center;justify-content:center;flex-direction:column;
      color:#fff;border-radius:10px;padding:20px;
    }
    .processing.show { display:flex; }
    .spinner { width:38px;height:38px;border:4px solid #555;border-top-color:#007bff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px; }
    .progress-track { width:230px;max-width:80%;height:6px;background:#444;border-radius:10px;overflow:hidden;margin-top:10px; }
    .progress-bar { height:100%;width:0;background:#007bff;transition:width .2s; }
    @keyframes spin { to { transform:rotate(360deg); } }

    @media(max-width:600px){
      header{font-size:22px}.container{width:92%}.kids-banner{height:200px}
      .controls button{flex:1 1 calc(50% - 10px)}.preview-area{min-height:280px}
    }
    @media print {
      header,.kids-banner,.upload-btn,.edit-toolbar,.controls,#previewPlaceholder { display:none!important; }
      body,.container,.preview-area { background:#fff;border:0;margin:0;padding:0;width:100%;max-width:none;box-shadow:none; }
      .page-editor canvas { max-height:none;max-width:100%; }
      .text-layer { display:none; }
    }
  </style>
</head>
<body>
  <header>BEGHDADI FILE PDF</header>

  <div class="container">
    <div class="kids-banner" id="bannerArea">
      <img src="kids.jpg" alt="صورة الأبناء">
    </div>

    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">حمل ملف</button>
    <input type="file" id="fileInput" accept="image/*,.pdf,application/pdf">

    <!-- حُذفت أزرار الرسم الأحمر والممحاة، وبقي تعديل النص فقط -->
    <div class="edit-toolbar" id="editToolbar">
      <span class="edit-hint">اضغط على أي كلمة لتعديلها مباشرة، امسح محتواها لحذفها.</span>
      <button id="deleteSelectedBtn" type="button">حذف النص المحدد</button>
    </div>

    <div class="preview-area" id="previewArea">
      <span style="color:#888" id="previewPlaceholder">ستظهر معاينة الملف هنا...</span>
      <div class="page-editor" id="pageEditor" hidden>
        <canvas id="editCanvas"></canvas>
        <div class="text-layer locked" id="textLayer"></div>
      </div>
      <div class="processing" id="processing">
        <div class="spinner"></div>
        <strong id="processingText">جاري تجهيز الملف...</strong>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-edit" id="editBtn">تعديل الكتابة (A4)</button>
      <button class="btn-confirm" id="confirmBtn">تأكيد التعديلات</button>
      <button class="btn-export-pdf" id="exportPdfBtn">تصدير كـ PDF</button>
      <button class="btn-print" id="printBtn">طباعة</button>
      <button class="btn-compress" id="compressBtn">ضغط الصورة</button>
      <button class="btn-export-img" id="exportImgBtn">تصدير كصورة</button>
    </div>
  </div>

  <script>
    const fileInput=document.getElementById('fileInput');
    const previewPlaceholder=document.getElementById('previewPlaceholder');
    const pageEditor=document.getElementById('pageEditor');
    const canvas=document.getElementById('editCanvas');
    const ctx=canvas.getContext('2d');
    const textLayer=document.getElementById('textLayer');
    const editToolbar=document.getElementById('editToolbar');
    const processing=document.getElementById('processing');
    const processingText=document.getElementById('processingText');
    const progressBar=document.getElementById('progressBar');

    let loadedFile=null;
    let loadedImage=null;
    let pdfDocument=null;
    let canvasScale=1;
    let editActive=false;
    let selectedText=null;
    let originalCanvas=null;
    let textItems=[];

    if(window.pdfjsLib){
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }

    function showProcessing(show,text='جاري تجهيز الملف...',percent=0){
      processing.classList.toggle('show',show);
      processingText.textContent=text;
      progressBar.style.width=Math.max(0,Math.min(100,percent))+'%';
    }

    function readImage(file){
      return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>{
          const img=new Image();
          img.onload=()=>resolve(img);
          img.onerror=()=>reject(new Error('تعذر عرض الصورة'));
          img.src=reader.result;
        };
        reader.onerror=()=>reject(new Error('تعذر قراءة الصورة'));
        reader.readAsDataURL(file);
      });
    }

    function prepareCanvas(width,height){
      canvas.width=width;canvas.height=height;
      canvasScale=Math.min(1,Math.max(0.2,(document.getElementById('previewArea').clientWidth-22)/width));
      canvas.style.width=(width*canvasScale)+'px';
      canvas.style.height=(height*canvasScale)+'px';
      pageEditor.style.width=(width*canvasScale)+'px';
      pageEditor.style.height=(height*canvasScale)+'px';
      textLayer.style.width=(width*canvasScale)+'px';
      textLayer.style.height=(height*canvasScale)+'px';
      previewPlaceholder.style.display='none';
      pageEditor.hidden=false;
    }

    function saveOriginal(){
      originalCanvas=document.createElement('canvas');
      originalCanvas.width=canvas.width;originalCanvas.height=canvas.height;
      originalCanvas.getContext('2d').drawImage(canvas,0,0);
    }

    fileInput.addEventListener('change',async event=>{
      const file=event.target.files[0];
      if(!file)return;
      loadedFile=file;loadedImage=null;pdfDocument=null;textItems=[];textLayer.innerHTML='';
      editToolbar.style.display='none';textLayer.classList.add('locked');editActive=false;
      showProcessing(true,'جاري تحميل الملف...',10);
      try{
        if(file.type.startsWith('image/')||/\.(png|jpe?g|webp|gif|bmp)$/i.test(file.name)){
          loadedImage=await readImage(file);
          const maxWidth=1600;
          const ratio=Math.min(1,maxWidth/loadedImage.naturalWidth);
          const width=Math.round(loadedImage.naturalWidth*ratio);
          const height=Math.round(loadedImage.naturalHeight*ratio);
          prepareCanvas(width,height);
          ctx.clearRect(0,0,width,height);
          ctx.drawImage(loadedImage,0,0,width,height);
        }else if(file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')){
          if(!window.pdfjsLib)throw new Error('مكتبة PDF غير متاحة');
          pdfDocument=await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
          const page=await pdfDocument.getPage(1);
          const viewport=page.getViewport({scale:1.7});
          prepareCanvas(Math.round(viewport.width),Math.round(viewport.height));
          await page.render({canvasContext:ctx,viewport}).promise;
        }else{
          throw new Error('نوع الملف غير مدعوم');
        }
        saveOriginal();
        showProcessing(false);
      }catch(error){
        console.error(error);showProcessing(false);alert('تعذر تحميل الملف. تأكد من اختيار صورة أو PDF صالح.');
      }
    });

    document.getElementById('editBtn').addEventListener('click',async()=>{
      if(!loadedFile||!originalCanvas){alert('الرجاء تحميل ملف أولاً!');return;}
      if(!window.Tesseract){alert('تعذر تشغيل أداة قراءة النص. تأكد من اتصال الإنترنت.');return;}
      showProcessing(true,'جاري تحديد الكتابة داخل الصورة...',1);
      try{
        const result=await Tesseract.recognize(canvas,'ara+eng',{
          logger:m=>{
            if(m.status==='recognizing text'){
              const p=Math.round((m.progress||0)*100);
              showProcessing(true,'جاري تحديد الكتابة... '+p+'%',p);
            }
          }
        });
        const words=(result.data.words||[]).filter(w=>w.text&&w.text.trim()&&w.confidence>30);
        textItems=words.map((w,index)=>({
          id:index,text:w.text,original:w.text,
          x:w.bbox.x0,y:w.bbox.y0,
          width:Math.max(18,w.bbox.x1-w.bbox.x0),
          height:Math.max(18,w.bbox.y1-w.bbox.y0),
          deleted:false
        }));
        renderTextLayer();
        editActive=true;textLayer.classList.remove('locked');editToolbar.style.display='flex';
        showProcessing(false);
        if(!textItems.length)alert('لم يتم العثور على كتابة واضحة. جرّب صورة أوضح.');
      }catch(error){
        console.error(error);showProcessing(false);alert('تعذر تحديد الكتابة. تحقق من الإنترنت أو جرّب صورة أوضح.');
      }
    });

    function renderTextLayer(){
      textLayer.innerHTML='';
      textItems.forEach(item=>{
        if(item.deleted)return;
        const el=document.createElement('div');
        el.className='ocr-text';
        el.contentEditable='plaintext-only';
        el.spellcheck=false;
        el.textContent=item.text;
        el.dataset.id=item.id;
        Object.assign(el.style,{
          left:(item.x*canvasScale)+'px',top:(item.y*canvasScale)+'px',
          minWidth:(item.width*canvasScale)+'px',minHeight:(item.height*canvasScale)+'px',
          fontSize:(Math.max(12,item.height*.8)*canvasScale)+'px'
        });
        el.addEventListener('focus',()=>selectedText=el);
        el.addEventListener('input',()=>{item.text=el.textContent;});
        textLayer.appendChild(el);
      });
    }

    document.getElementById('deleteSelectedBtn').addEventListener('click',()=>{
      if(!selectedText){alert('اضغط أولاً على النص الذي تريد حذفه.');return;}
      const item=textItems.find(x=>String(x.id)===selectedText.dataset.id);
      if(item)item.deleted=true;
      selectedText.remove();selectedText=null;
    });

    document.getElementById('confirmBtn').addEventListener('click',()=>{
      if(!editActive){return;}
      textLayer.querySelectorAll('.ocr-text').forEach(el=>{
        const item=textItems.find(x=>String(x.id)===el.dataset.id);
        if(item)item.text=el.textContent;
      });
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(originalCanvas,0,0);
      textItems.forEach(item=>{
        const changed=item.deleted||item.text!==item.original;
        if(!changed)return;
        ctx.fillStyle='#fff';
        ctx.fillRect(item.x-3,item.y-3,item.width+8,item.height+8);
        if(item.deleted||!item.text.trim())return;
        const size=Math.max(12,item.height*.8);
        ctx.fillStyle='#000';ctx.font=`bold ${size}px Arial`;ctx.textBaseline='top';
        ctx.direction=/[\u0600-\u06FF]/.test(item.text)?'rtl':'ltr';
        const textX=ctx.direction==='rtl'?item.x+item.width:item.x;
        ctx.fillText(item.text,textX,item.y,Math.max(item.width*2,80));
      });
      saveOriginal();
      textLayer.innerHTML='';textLayer.classList.add('locked');editToolbar.style.display='none';
      editActive=false;selectedText=null;
      alert('تم حفظ تعديلات الكتابة!');
    });

    document.getElementById('exportImgBtn').addEventListener('click',()=>{
      if(!originalCanvas){alert('الرجاء تحميل ملف أولاً.');return;}
      const link=document.createElement('a');
      link.href=canvas.toDataURL('image/jpeg',.95);
      link.download='BEGHDADI_A4_Image.jpg';link.click();
    });

    document.getElementById('exportPdfBtn').addEventListener('click',()=>{
      if(!originalCanvas){alert('الرجاء تحميل ملف أولاً.');return;}
      if(!window.jspdf){alert('تعذر تشغيل تصدير PDF. تحقق من الإنترنت.');return;}
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:canvas.width>canvas.height?'l':'p',unit:'px',format:[canvas.width,canvas.height],hotfixes:['px_scaling']});
      pdf.addImage(canvas.toDataURL('image/jpeg',.95),'JPEG',0,0,canvas.width,canvas.height);
      pdf.save('BEGHDADI_A4_Converted.pdf');
    });

    document.getElementById('printBtn').addEventListener('click',()=>window.print());

    document.getElementById('compressBtn').addEventListener('click',()=>{
      if(!originalCanvas){alert('الرجاء تحميل ملف أولاً.');return;}
      const img=new Image();
      img.onload=()=>{
        ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
        saveOriginal();alert('تم ضغط الملف بنجاح!');
      };
      img.src=canvas.toDataURL('image/jpeg',.5);
    });

    window.addEventListener('resize',()=>{
      if(!canvas.width)return;
      const old=canvasScale;
      canvasScale=Math.min(1,Math.max(.2,(document.getElementById('previewArea').clientWidth-22)/canvas.width));
      canvas.style.width=(canvas.width*canvasScale)+'px';canvas.style.height=(canvas.height*canvasScale)+'px';
      pageEditor.style.width=(canvas.width*canvasScale)+'px';pageEditor.style.height=(canvas.height*canvasScale)+'px';
      textLayer.style.width=(canvas.width*canvasScale)+'px';textLayer.style.height=(canvas.height*canvasScale)+'px';
      const ratio=canvasScale/old;
      textLayer.querySelectorAll('.ocr-text').forEach(el=>{
        ['left','top','minWidth','minHeight','fontSize'].forEach(p=>el.style[p]=(parseFloat(el.style[p])*ratio)+'px');
      });
    });
  </script>
</body>
</html>
